name: Rebuild textbook and readings

on:
  push:
    branches: [main]
    paths:
      - 'src/ch*.md'
      - 'src/preamble.tex'
      - 'src/figures.py'
      - 'scripts/build.py'
      - '.github/workflows/rebuild-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: textbook-build
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out course
        uses: actions/checkout@v4
      - name: Install typesetting tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc texlive-latex-extra texlive-fonts-recommended \
            texlive-pictures poppler-utils
      - name: Regenerate course HTML, LaTeX, and PDFs
        run: python3 scripts/build.py
      - name: Verify book and lessons
        run: |
          node tests/math.test.js
          python3 scripts/verify.py
      - name: Commit compiled readings and textbooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild synchronized readings and textbook PDFs"
            git push
          fi
